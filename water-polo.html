<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splash Cup Water Polo</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--fg:#f2f2f2}}
:root[data-theme="dark"]{--bg:#10151c;--fg:#f2f2f2}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;width:min(100vw,calc(100vh*1.7778));aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(8,40,90,.88);color:#fff;text-align:center;overflow:auto;padding:10px;font-size:clamp(11px,2.2vw,18px)}
#ov h1{margin:0;font-size:clamp(22px,5vw,46px);color:#ffe600;text-shadow:2px 2px 0 #1a6fb5}
#ov p{margin:2px 0;max-width:560px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(94%,560px)}
button{font:inherit;color:#fff;background:#1d7fd6;border:2px solid #fff;border-radius:12px;padding:8px 10px;cursor:pointer}
button:hover{background:#2a93f0}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;vertical-align:middle;margin-right:5px}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b2a55;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
.row{background:rgba(255,255,255,.12);border-radius:8px;padding:4px 10px;margin:2px;min-width:280px}
</style></head><body>
<div id="rot"><div style="font-size:60px">📱↻</div><div>Rotate your phone to landscape to play</div></div><div id="wrap"><canvas id="cv" width="800" height="450"></canvas><div id="ov"></div></div>
<script>
const W=800,H=450,PL=40,PR=760,PT=20,PB=395,GY1=140,GY2=258,MY=207.5,SK='#c99a6e';
const TEAMS=[["Red Sharks","#e53030"],["Blue Orcas","#2450e0"],["Green Gators","#1f9d4a"],["Yellow Jackets","#f0b800"],["Purple Rays","#8a3fd0"],["Orange Otters","#f07818"],["Black Pearls","#333333"],["Pink Dolphins","#ec5fa8"]];
const ROUNDS=["Quarter-finals","Semi-finals","Final"];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let G=null,T=null,last=0;
const R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- AUDIO ---------- */
let ac,master,nb;
function audioInit(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}if(ac){ac.resume&&ac.resume();return}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination);const n=ac.sampleRate*2;nb=ac.createBuffer(1,n,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=R()*2-1;
const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=450;const g=ac.createGain();g.gain.value=.05;s.connect(f);f.connect(g);g.connect(master);s.start()}catch(e){ac=null}}
function noise(type,f1,f2,dur,vol,att=.02,q=1){if(!ac)return;const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;const t=ac.currentTime;f.frequency.setValueAtTime(f1,t);f.frequency.linearRampToValueAtTime(f2,t+dur);const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.1)}
function tone(type,f1,f2,dur,vol,dl=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+dl;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
const SFX={
splash:()=>noise('highpass',1500,3500,.18,.15),
throw:()=>{noise('bandpass',600,2400,.2,.3,.01,2);tone('sine',300,150,.12,.1)},
catch:()=>tone('sine',420,300,.1,.12),
whistle:()=>{tone('square',2500,2650,.3,.1);tone('square',2350,2450,.45,.1,.38)},
cheer:()=>{noise('bandpass',700,1500,2.6,.7,.3,.8);noise('bandpass',1800,2800,2.2,.22,.3,1);[0,.3,.6].forEach(d=>tone('triangle',500+d*300,900+d*400,.5,.07,d));tone('square',440,440,.5,.05,.1);tone('square',554,554,.5,.05,.1)},
tense:()=>{noise('lowpass',300,1100,1.5,.55,.5,1);tone('sawtooth',90,170,1.2,.08);tone('square',230,110,.3,.06)},
save:()=>{noise('lowpass',400,900,1,.4,.3);tone('sawtooth',120,200,.6,.06)}};

/* ---------- MATCH ---------- */
function startMatch(a,b){
G={ta:a,tb:b,sa:0,sb:0,q:1,t:60,P:[],ball:{x:400,y:MY,vx:0,vy:0,owner:null,lastTeam:null,last:null,cd:0,thrown:false},sel:2,aim:null,mark:null,banner:null,fz:0,fzf:null,over:false};
for(let s=0;s<2;s++)for(let i=0;i<4;i++)G.P.push({s,i,x:0,y:0,tx:0,ty:0,f:s?Math.PI:0,cool:0,prot:0,hold:0});
reset(0);ov.style.display='none';SFX.whistle();}
function reset(bt){const b=G.ball;G.P.forEach(p=>{const d=p.s?-1:1;p.x=[p.s?PR-35:PL+35,400-d*60,400-d*20,400-d*60][p.i];p.y=[MY,100,MY,315][p.i];p.tx=p.x;p.ty=p.y;p.f=p.s?Math.PI:0;p.cool=0;p.prot=0;p.hold=0});
const c=G.P[bt*4+2];b.owner=c;c.prot=2.5;b.thrown=false;b.lastTeam=null;b.last=null;b.vx=b.vy=0;b.cd=0;if(bt===0)G.sel=2}
function throwB(p,tx,ty,sp){const b=G.ball;let dx=tx-p.x,dy=ty-p.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;b.owner=null;b.x=p.x+dx*14;b.y=p.y+dy*14;b.vx=dx*sp;b.vy=dy*sp;b.lastTeam=p.s;b.last=p;b.cd=.35;b.thrown=true;p.cool=.5;p.f=Math.atan2(dy,dx);SFX.throw()}
function banner(text,color,t=1.3){G.banner={text,color,t,t0:t}}
function take(p,steal){const b=G.ball,was=b.thrown,opp=b.lastTeam!==null&&b.lastTeam!==p.s;b.owner=p;b.thrown=false;b.vx=b.vy=0;p.hold=0;p.prot=p.s?2.2:D.up;
if(steal||(was&&opp)){if(p.i===0&&!steal){banner('SAVE!','#2a7bff',1.1);SFX.save()}else{banner('INTERCEPTION!','#e11',1.3);SFX.tense()}}else SFX.catch();
if(p.s===0&&p.i>0){G.sel=p.i;p.tx=p.x;p.ty=p.y}}
function goal(s){s?G.sb++:G.sa++;banner('GOAL!!','#f7ea00',2.3);SFX.cheer();G.fz=2.4;const b=G.ball;b.owner=null;b.vx=b.vy=0;G.aim=null;G.fzf=()=>{if(G.q===5){finish();return}reset(1-s)}}
function endQ(){G.t=0;SFX.whistle();G.aim=null;
if(G.q<4){banner('END OF Q'+G.q,'#fff',1.6);G.fz=1.8;G.fzf=()=>{G.q++;G.t=60;reset(G.q%2?0:1);SFX.whistle()}}
else if(G.sa!==G.sb||G.q===5)finish();
else{banner('OVERTIME!','#f7ea00',2);G.fz=2.2;G.fzf=()=>{G.q=5;G.t=45;reset(R()<.5?0:1);SFX.whistle()}}}
function finish(){G.over=true;G.pen=G.sa===G.sb;G.win=G.pen?(R()<.5?0:1):(G.sa>G.sb?0:1);setTimeout(matchEnd,1300)}

/* ---------- AI ---------- */
function pass(p){const d=p.s?-1:1;let best=null,bs=-1e9;G.P.forEach(q=>{if(q.s!==p.s||q===p)return;let m=1e9;G.P.forEach(o=>{if(o.s!==p.s)m=Math.min(m,dst(o,q))});const sc=(p.i===0?-dst(p,q):(q.x-p.x)*d*.6)-(m<45?150:0)-dst(p,q)*.12+R()*30;if(sc>bs){bs=sc;best=q}});
if(best)throwB(p,best.x+Math.cos(best.f)*20,best.y+Math.sin(best.f)*20,320)}
function shoot(p){const atk=p.s?PL:PR,kp=G.P[(1-p.s)*4];const ay=MY+(kp.y>MY?-1:1)*(15+R()*22)+(R()-.5)*D.ac;throwB(p,atk,ay,470+R()*50)}
function ai(p,dt){const b=G.ball,d=p.s?-1:1,own=b.owner===p,mg=p.s?PR:PL,ag=p.s?PL:PR;
if(p.i===0){if(own){p.hold+=dt;if(p.hold>.8)pass(p);return}
p.ty=cl(b.y,GY1-6,GY2+6);p.tx=mg+d*(Math.abs(b.x-mg)<170?55:35);return}
if(own){p.hold+=dt;p.tx=ag;p.ty=MY+(p.y-MY)*.5;let press=false;G.P.forEach(o=>{if(o.s!==p.s&&dst(o,p)<42)press=true});
if((Math.abs(p.x-ag)<210&&p.hold>(p.s?D.sh:1.2))||p.hold>(p.s?D.sh+2:3.2))shoot(p);else if(press&&p.hold>.6&&R()<dt*2.5)pass(p);return}
const ys=[0,95,MY,320];
if(b.owner&&b.owner.s===p.s){p.tx=cl(b.owner.x+d*(50+p.i*30),PL+60,PR-60);p.ty=ys[p.i]+Math.sin(performance.now()/900+p.i)*20;return}
let cn=null,cd=1e9;G.P.forEach(q=>{if(q.s===p.s&&q.i>0){const t=b.owner?dst(q,b.owner):dst(q,b);if(t<cd){cd=t;cn=q}}});
if(b.owner){if(cn===p&&b.owner.prot<(p.s?D.pr:1)){p.tx=b.owner.x+d*-6;p.ty=b.owner.y}else{p.tx=lerp(b.owner.x,mg,.4);p.ty=lerp(b.owner.y,MY,.3)+(p.i-2)*55}}
else{if(cn===p){p.tx=b.x+b.vx*.3;p.ty=b.y+b.vy*.3}else{p.tx=lerp(b.x,mg,.3);p.ty=ys[p.i]}}}

function inGoal(b){const z=b.thrown?14+Math.hypot(b.vx,b.vy)*.04:3,v=sy(b.y)-z;return v>sy(GY1)-84&&v<sy(GY2)+6}
function step(dt){
if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
if(G.mark){G.mark.t-=dt;if(G.mark.t<=0)G.mark=null}
if(G.fz>0){G.fz-=dt;if(G.fz<=0){const f=G.fzf;G.fzf=null;f&&f()}return}
G.t-=dt;if(G.t<=0){endQ();return}
const b=G.ball;b.cd-=dt;
G.P.forEach(p=>{p.cool-=dt;p.prot-=dt;const user=p.s===0&&p.i===G.sel;if(!user)ai(p,dt);
p.tx=cl(p.tx,PL+8,PR-8);p.ty=cl(p.ty,PT+8,PB-8);
const dx=p.tx-p.x,dy=p.ty-p.y,l=Math.hypot(dx,dy);
if(l>3){const sp=(p.i===0?(p.s?D.ks:85):user?96:(p.s?D.sp:84))*(b.owner===p?.88:1);p.x+=dx/l*sp*dt;p.y+=dy/l*sp*dt;p.f=Math.atan2(dy,dx);if(user&&R()<dt*3)SFX.splash()}
else if(b.owner===p&&!user)p.f=Math.atan2(MY-p.y,(p.s?PL:PR)-p.x)});
if(b.owner){b.x=b.owner.x+Math.cos(b.owner.f)*12;b.y=b.owner.y+Math.sin(b.owner.f)*12;const c=b.owner;
for(const q of G.P){if(q.s===c.s||c.prot>0||q.cool>0||dst(q,c)>17)continue;const rate=(q.s===0&&q.i===G.sel)?3:(q.i===0?.15:.35)*D.st;
if(R()<rate*dt){c.cool=1.2;take(q,true);break}}}
else{b.x+=b.vx*dt;b.y+=b.vy*dt;const f=Math.exp(-.45*dt);b.vx*=f;b.vy*=f;
if(Math.hypot(b.vx,b.vy)<60)b.thrown=false;
if(b.y<PT+3){b.y=PT+3;b.vy=Math.abs(b.vy)*.7}if(b.y>PB-3){b.y=PB-3;b.vy=-Math.abs(b.vy)*.7}
if(b.x<PL){if(inGoal(b)){goal(1);return}b.x=PL+3;b.vx=Math.abs(b.vx)*.6}
if(b.x>PR){if(inGoal(b)){goal(0);return}b.x=PR-3;b.vx=-Math.abs(b.vx)*.6}
for(const p of G.P){if(p.cool>0||(b.last===p&&b.cd>0))continue;if(dst(p,b)<(p.i===0?(p.s?D.kr:20):15)){take(p);break}}}}

/* ---------- INPUT ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{audioInit();if(!G||G.over||G.fz>0)return;const m=pt(e),c=G.ball.owner;
if(c&&c.s===0&&c.i===G.sel&&dst(m,c)<34){G.aim={x:m.x,y:m.y};cv.setPointerCapture(e.pointerId);return}
for(const p of G.P){if(p.s===0&&p.i>0&&dst(m,p)<22){G.sel=p.i;p.tx=p.x;p.ty=p.y;return}}
const p=G.P[G.sel];p.tx=cl(m.x,PL+8,PR-8);p.ty=cl(m.y,PT+8,PB-8);G.mark={x:p.tx,y:p.ty,t:.6};SFX.splash()});
cv.addEventListener('pointermove',e=>{if(G&&G.aim){const m=pt(e);G.aim.x=m.x;G.aim.y=m.y}});
function release(){if(!G||!G.aim)return;const c=G.ball.owner,a=G.aim;G.aim=null;if(!c||c.s!==0||c.i!==G.sel)return;
const dx=c.x-a.x,dy=c.y-a.y,L=Math.hypot(dx,dy);if(L>14)throwB(c,c.x+dx,c.y+dy,200+Math.min(L,100)*3.2)}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',()=>{if(G)G.aim=null});

/* ---------- DRAW ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawPool(){ctx.fillStyle='#7ad0ff';rr(PL-6,PT-6,PR-PL+12,PB-PT+12,26);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(400,PT);ctx.lineTo(400,PB);ctx.moveTo(PL+110,PT);ctx.lineTo(PL+110,PB);ctx.moveTo(PR-110,PT);ctx.lineTo(PR-110,PB);ctx.stroke();ctx.setLineDash([]);
[[PL,-1],[PR,1]].forEach(([x,d])=>{ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.strokeRect(d<0?x-34:x,GY1-6,34,GY2-GY1+12);ctx.beginPath();for(let k=0;k<=GY2-GY1+12;k+=8){ctx.moveTo(d<0?x-34:x,GY1-6+k);ctx.lineTo(d<0?x:x+34,GY1-6+k+8)}ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,GY1);ctx.lineTo(x,GY2);ctx.stroke()})}
function drawBall(x,y){ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.fill();ctx.stroke();ctx.lineWidth=1.2;['#222','#f0c000','#d22'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(x-5,y-3+i*3);ctx.quadraticCurveTo(x,y-6+i*3,x+5,y-3+i*3);ctx.stroke()})}
function drawP(p){const col=TEAMS[p.s?G.tb:G.ta][1];ctx.save();ctx.translate(p.x,p.y);
ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(0,2,17,12,0,0,7);ctx.fill();
if(p.s===0&&p.i===G.sel){ctx.strokeStyle='#ffe600';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.stroke();ctx.setLineDash([])}
ctx.rotate(p.f);ctx.fillStyle=SK;ctx.beginPath();ctx.ellipse(0,0,8,12,0,0,7);ctx.fill();
ctx.strokeStyle=SK;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,-18);ctx.moveTo(0,10);ctx.lineTo(8,18);ctx.stroke();
ctx.fillStyle=SK;ctx.beginPath();ctx.arc(5,0,7,0,7);ctx.fill();
ctx.fillStyle=col;ctx.beginPath();ctx.arc(5,0,7.6,Math.PI/2,Math.PI*1.5);ctx.fill();
if(p.i===0){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(5,0,7.6,Math.PI/2,Math.PI*1.5);ctx.stroke()}
ctx.restore();
if(p.s===0&&p.i===G.sel){ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(p.x,p.y-24);ctx.lineTo(p.x-5,p.y-32);ctx.lineTo(p.x+5,p.y-32);ctx.fill()}}
function drawBoard(){const a=TEAMS[G.ta][1],b=TEAMS[G.tb][1];ctx.fillStyle='#262626';rr(250,382,298,64,18);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 38px "Comic Sans MS",system-ui,sans-serif';ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText(G.sa,310,416);ctx.fillText(G.sb,438,416);
ctx.fillStyle=a;rr(358,398,13,36,6);ctx.fill();ctx.fillStyle=b;rr(377,398,13,36,6);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 17px "Comic Sans MS",system-ui,sans-serif';ctx.textAlign='right';ctx.fillText(G.q===5?'OT':'Q'+G.q,530,398);
ctx.fillStyle='#3de8d0';ctx.font='bold 26px "Comic Sans MS",system-ui,sans-serif';const s=Math.max(0,Math.ceil(G.t));ctx.fillText('00:'+String(s).padStart(2,'0'),532,426);ctx.textAlign='left'}
function drawBanner(){const bn=G.banner;if(!bn)return;const age=bn.t0-bn.t,sc=Math.min(1,age*7)*(1+.05*Math.sin(age*12));
ctx.fillStyle='rgba(110,110,110,.6)';ctx.fillRect(0,MY-62,W,124);
ctx.save();ctx.translate(400,MY);ctx.font='bold 110px "Comic Sans MS","Chalkboard SE",system-ui,sans-serif';const w=ctx.measureText(bn.text).width,fit=Math.min(1,700/w);ctx.scale(sc*fit,sc*fit);ctx.rotate(-.03);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=10;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineJoin='round';ctx.strokeText(bn.text,0,4);ctx.fillStyle=bn.color;ctx.fillText(bn.text,0,0);ctx.restore();ctx.textAlign='left'}
function draw(){ctx.clearRect(0,0,W,H);if(!G)return;drawPool();const b=G.ball;
if(G.mark){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(G.mark.x,G.mark.y,18*(1-G.mark.t/.6)+3,0,7);ctx.stroke()}
[...G.P].sort((a,c)=>a.y-c.y).forEach(drawP);
if(!b.owner||true)drawBall(b.x,b.y);
const c=b.owner;if(G.aim&&c){const dx=c.x-G.aim.x,dy=c.y-G.aim.y,L=Math.hypot(dx,dy);if(L>6){const ux=dx/L,uy=dy/L;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(G.aim.x,G.aim.y);ctx.stroke();ctx.fillStyle='#fff';for(let k=1;k<=9;k++){const dd=k*Math.min(L,100)*.45;ctx.beginPath();ctx.arc(c.x+ux*dd,c.y+uy*dd,Math.max(1.5,4-k*.25),0,7);ctx.fill()}}}
drawBoard();drawBanner()}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G&&!G.over)step(dt);draw();requestAnimationFrame(frame)}

/* ---------- CHAMPIONSHIP ---------- */
const sw=i=>`<span class="sw" style="background:${TEAMS[i][1]}"></span>${TEAMS[i][0]}`;
function show(h){ov.innerHTML=h;ov.style.display='flex'}
function title(){G=null;show(`<h1>SPLASH CUP</h1><p>Choose difficulty, then your team:</p><div class="g">${Object.keys(DIFFS).map(k=>`<button onclick="setDiff('${k}')" style="${k===DK?'background:#f0a800;color:#111':''}">${DIFFS[k].n}</button>`).join('')}</div><p style="opacity:.85">${D.d}</p><div class="g">${TEAMS.map((t,i)=>`<button onclick="begin(${i})"><span class="sw" style="background:${t[1]}"></span>${t[0]}</button>`).join('')}</div>
<p><b>Tap</b> water = swim there &nbsp;·&nbsp; <b>Tap</b> a teammate = switch player<br><b>Pull back</b> from the ball carrier and release = throw / shoot (opposite direction)<br>Touch the ball carrier of the other team to steal. 4 quarters × 1 minute.</p>`)}
function begin(me){const o=[...Array(8).keys()].filter(i=>i!==me).sort(()=>R()-.5);T={me,list:[me,...o],round:0};bracket()}
function bracket(){const L=T.list,ms=[];for(let k=0;k<L.length;k+=2)ms.push([L[k],L[k+1]]);
show(`<h1>${ROUNDS[T.round]}</h1>${ms.map((m,k)=>`<div class="row" style="${k?'':'outline:2px solid #ffe600'}">${sw(m[0])} &nbsp;vs&nbsp; ${sw(m[1])}</div>`).join('')}<p>Your match is highlighted.</p><button onclick="startMatch(T.me,T.list[1])">Play match</button>`)}
function matchEnd(){const L=T.list,won=G.win===0,res=[];const next=[];
for(let k=0;k<L.length;k+=2){let a=L[k],b=L[k+1],sa,sb,w;if(k===0){sa=G.sa;sb=G.sb;w=won?a:b}else{sa=6+(R()*8|0);sb=6+(R()*8|0);if(sa===sb)sa++;w=sa>sb?a:b}next.push(w);res.push(`<div class="row">${sw(a)} <b>${sa}–${sb}</b> ${sw(b)}</div>`)}
const pen=G.pen?`<p>Level after overtime — decided on penalties: ${won?'you win!':'you lose.'}</p>`:'';
if(won&&T.round===2)show(`<h1>🏆 CHAMPIONS!</h1><p>${sw(T.me)} win the Splash Cup!</p>${res.join('')}<button onclick="title()">Play again</button>`);
else if(won){T.list=next;T.round++;show(`<h1>YOU WIN!</h1>${res.join('')}${pen}<button onclick="bracket()">Next round: ${ROUNDS[T.round]}</button>`)}
else show(`<h1>ELIMINATED</h1><p>Knocked out in the ${ROUNDS[T.round]}.</p>${res.join('')}${pen}<button onclick="title()">Try again</button>`)}
/* ---------- SIDE-VIEW RENDERER (matches the hand-drawn sketch) ---------- */
const SY0=62,SH=300,sy=y=>SY0+(y-PT)/(PB-PT)*SH,sc=y=>.8+.4*(y-PT)/(PB-PT);
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:PT+((e.clientY-r.top)/r.height*H+8-SY0)/SH*(PB-PT)}}
const BLOB=[];(function(){const x0=16,x1=784,y0=36,y1=378;for(let i=0;i<=24;i++)BLOB.push([lerp(x0,x1,i/24),y0+(R()-.5)*10]);for(let i=1;i<=8;i++)BLOB.push([x1+(R()-.5)*8,lerp(y0,y1,i/8)]);for(let i=1;i<=24;i++)BLOB.push([lerp(x1,x0,i/24),y1+(R()-.5)*10]);for(let i=1;i<8;i++)BLOB.push([x0+(R()-.5)*8,lerp(y1,y0,i/8)])})();
function goalDraw(x,d){const y1=sy(GY1),y2=sy(GY2),h=84,xa=Math.min(x,x+d*38),xb=Math.max(x,x+d*38);ctx.fillStyle='rgba(120,120,120,.35)';ctx.fillRect(xa,y1-h,xb-xa,y2-y1+h);ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<=xb-xa;k+=8){ctx.moveTo(xa+k,y1-h);ctx.lineTo(xa+k+(d<0?-6:6),y2)}for(let k=y1-h;k<=y2;k+=9){ctx.moveTo(xa,k);ctx.lineTo(xb,k+3)}ctx.stroke();ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.strokeRect(xa,y1-h,xb-xa,y2-y1+h);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y1-h);ctx.lineTo(x,y2);ctx.stroke()}
function drawPool(){const t=performance.now()/700;ctx.fillStyle='#7ad0ff';ctx.beginPath();BLOB.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
ctx.fillStyle='rgba(30,110,190,.22)';ctx.fillRect(30,42,740,26);
ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;for(let k=0;k<7;k++){const y=88+k*42;ctx.beginPath();for(let x=40;x<=760;x+=10){const yy=y+Math.sin(x/38+t+k)*2.5;x===40?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke()}
ctx.strokeStyle='rgba(255,255,255,.8)';ctx.setLineDash([2,10]);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(400,sy(PT)-6);ctx.lineTo(400,sy(PB)+6);ctx.stroke();ctx.setLineDash([]);
goalDraw(PL,-1);goalDraw(PR,1)}
function drawBall(x,y,z){z=z||0;ctx.fillStyle='rgba(20,80,140,.25)';ctx.beginPath();ctx.ellipse(x,y,7,3,0,0,7);ctx.fill();y-=z;ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.stroke();ctx.lineWidth=1.2;['#222','#f0c000','#d22'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(x-5,y-3+i*3);ctx.quadraticCurveTo(x,y-6+i*3,x+5,y-3+i*3);ctx.stroke()})}
function drawP(p){const s=sc(p.y),Y=sy(p.y),col=TEAMS[p.s?G.tb:G.ta][1],dir=Math.cos(p.f)>=0?1:-1,carry=G.ball.owner===p,mv=Math.hypot(p.tx-p.x,p.ty-p.y)>3,ph=performance.now()/150+p.i*2,up=carry||p.i===0;
ctx.save();ctx.translate(p.x,Y);
if(p.s===0&&p.i===G.sel){ctx.strokeStyle='#ffe600';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.beginPath();ctx.ellipse(0,3,24*s,8*s,0,0,7);ctx.stroke();ctx.setLineDash([])}
ctx.scale(s*dir,s);
ctx.strokeStyle=SK;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();
if(up){ctx.moveTo(4,-22);ctx.lineTo(12,-42);ctx.moveTo(-3,-22);ctx.lineTo(-10,-38)}
else{const a=mv?Math.sin(ph)*9:3;ctx.moveTo(3,-22);ctx.lineTo(14+a,-26-Math.abs(a)*.6);ctx.moveTo(-3,-22);ctx.lineTo(-13-a,-24)}ctx.stroke();
ctx.fillStyle=SK;ctx.beginPath();ctx.ellipse(0,-14,9,13,0,0,7);ctx.fill();
ctx.beginPath();ctx.arc(3,-31,7,0,7);ctx.fill();
ctx.fillStyle=col;ctx.beginPath();ctx.arc(3,-31.5,7.8,Math.PI*.95,Math.PI*2.05);ctx.fill();ctx.beginPath();ctx.arc(-4,-30,3.2,0,7);ctx.fill();
if(p.i===0){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(3,-31.5,7.8,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}
ctx.fillStyle='rgba(122,208,255,.88)';ctx.beginPath();ctx.moveTo(-20,-8);for(let x=-20;x<=20;x+=5)ctx.lineTo(x,-8+Math.sin(x/4+ph*.6)*1.6);ctx.lineTo(20,10);ctx.lineTo(-20,10);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-5,17,4,0,Math.PI*.1,Math.PI*.9);ctx.stroke();
if(mv){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,-4);ctx.lineTo(-38,-4);ctx.stroke()}
ctx.restore();
if(carry)drawBall(p.x+dir*12*s,Y-44*s+6,0);
if(p.s===0&&p.i===G.sel){ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(p.x,Y-58*s);ctx.lineTo(p.x-6,Y-68*s);ctx.lineTo(p.x+6,Y-68*s);ctx.fill()}}
function draw(){ctx.clearRect(0,0,W,H);if(!G)return;drawPool();const b=G.ball;
if(G.mark){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(G.mark.x,sy(G.mark.y),(18*(1-G.mark.t/.6)+3),(18*(1-G.mark.t/.6)+3)*.35,0,0,7);ctx.stroke()}
const ps=[...G.P].sort((a,c)=>a.y-c.y);let drawn=!!b.owner;
ps.forEach(p=>{if(!drawn&&b.y<p.y){drawn=true;fb()}drawP(p)});if(!drawn)fb();
function fb(){const sp=Math.hypot(b.vx,b.vy);if(b.thrown&&sp>120){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();const k=.09,z=14+sp*.04;ctx.moveTo(b.x,sy(b.y)-z);ctx.lineTo(b.x-b.vx*k,sy(b.y-b.vy*k)-z);ctx.stroke()}drawBall(b.x,sy(b.y),b.thrown?14+sp*.04:3)}
const c=b.owner;if(G.aim&&c){const dx=c.x-G.aim.x,dy=c.y-G.aim.y,L=Math.hypot(dx,dy);if(L>6){const ux=dx/L,uy=dy/L,s=sc(c.y);ctx.fillStyle='#fff';for(let k=1;k<=9;k++){const dd=k*Math.min(L,100)*.45;ctx.beginPath();ctx.arc(c.x+ux*dd,sy(c.y+uy*dd)-44*s-Math.sin(k/10*Math.PI)*10,Math.max(1.6,4.5-k*.3),0,7);ctx.fill()}}}
drawBoard();drawBanner()}
